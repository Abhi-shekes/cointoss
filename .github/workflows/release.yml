name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write # needed to create GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing signing secrets. See CI_SETUP.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Build App Bundle (release)
        run: flutter build appbundle --release

      - name: Stage artifacts
        id: stage
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d ' \r')
          SHORT=${VERSION%%+*}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/CoinToss-${SHORT}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/CoinToss-${SHORT}.aab"
          echo "version=$SHORT" >> "$GITHUB_OUTPUT"
          echo "tag=v${SHORT}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stage.outputs.tag }}
          name: Coin Toss ${{ steps.stage.outputs.version }} (build ${{ github.run_number }})
          generate_release_notes: true
          files: |
            dist/CoinToss-${{ steps.stage.outputs.version }}.apk
            dist/CoinToss-${{ steps.stage.outputs.version }}.aab
